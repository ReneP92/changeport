# Local development cluster: a control plane and three workers, each worker
# in its own zone like the three availability zones on EKS, so rack-aware
# placement and zone outages can be tested locally. The node image is pinned
# in hack/lib.sh (KIND_NODE_IMAGE).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-c
