# Scrape configuration of VictoriaMetrics, following docs/metrics-labels.md.
# %{CHANGEPORT_ENV} is the environment, set by the overlay.
global:
  scrape_interval: 30s
  external_labels:
    env: "%{CHANGEPORT_ENV}"
scrape_configs:
  # The Strimzi Metrics Reporter on port 9404 of every customer's brokers and
  # controllers.
  - job_name: kafka
    kubernetes_sd_configs:
      - role: pod
    relabel_configs: &kafka-pods
      - source_labels: [__meta_kubernetes_pod_label_strimzi_io_kind, __meta_kubernetes_pod_label_strimzi_io_component_type, __meta_kubernetes_pod_container_port_number]
        regex: Kafka;kafka;9404
        action: keep
      # Every series carries its tenant; pods without one are not scraped.
      - source_labels: [__meta_kubernetes_pod_label_changeport_io_tenant]
        regex: .+
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_changeport_io_tenant]
        target_label: tenant
      - source_labels: [__meta_kubernetes_pod_label_strimzi_io_cluster]
        target_label: cluster
      - source_labels: [__meta_kubernetes_pod_label_topology_kubernetes_io_zone]
        target_label: zone
      - source_labels: [__meta_kubernetes_pod_name]
        regex: .*-([0-9]+)
        target_label: node_id
      # The pod name, which survives restarts, rather than its address.
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
    metric_relabel_configs:
      # The metrics clients push, which the kafka-clients job takes.
      - if: '{__name__=~"clients_.*"}'
        action: drop
      # The reporter always exports JVM and process metrics, whatever its
      # allowList says; keep memory, garbage collection, threads and CPU.
      - if: '{__name__=~"jvm_.*|process_.*", __name__!~"jvm_memory_(used|max)_bytes|jvm_gc_collection_seconds_(count|sum)|jvm_threads_current|process_cpu_seconds_total|process_open_fds"}'
        action: drop
      # Request latency only for producing and fetching.
      - if: '{__name__=~"kafka_network_requestmetrics_totaltimems.*", request!~"Produce|Fetch|FetchConsumer|FetchFollower"}'
        action: drop
  # The metrics customers' clients push to the same brokers (KIP-714), which
  # the brokers' metrics reporter exposes as clients_* series. Customers
  # decide how many clients they run, so this job has its own limit on the
  # unique series per broker in 24 hours: past it, new client series are
  # dropped and the broker's own series are unaffected.
  - job_name: kafka-clients
    series_limit: 2000
    kubernetes_sd_configs:
      - role: pod
    relabel_configs: *kafka-pods
    metric_relabel_configs:
      - if: '{__name__!~"clients_.*"}'
        action: drop
  # The Kafka agent next to every customer's cluster.
  - job_name: kafka-agent
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
        regex: changeport-agent;metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_changeport_io_tenant]
        regex: .+
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_changeport_io_tenant]
        target_label: tenant
      - source_labels: [__meta_kubernetes_pod_label_changeport_io_kafka_cluster]
        target_label: cluster
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
  # The Kafka Connect worker of every customer with Postgres CDC sources:
  # Debezium's and Connect's metrics from its JMX exporter on port 9404,
  # each labelled with its source. On dedicated clusters the Kafka cluster
  # is named after the tenant.
  - job_name: kafka-connect
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_strimzi_io_kind, __meta_kubernetes_pod_container_port_number]
        regex: KafkaConnect;9404
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_changeport_io_tenant]
        regex: .+
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_changeport_io_tenant]
        target_label: tenant
      - source_labels: [__meta_kubernetes_pod_label_changeport_io_tenant]
        target_label: cluster
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
    metric_relabel_configs:
      # The exporter always exports the JVM's metrics; keep memory, garbage
      # collection, threads and CPU, as for the brokers.
      - if: '{__name__=~"jvm_.*|process_.*", __name__!~"jvm_memory_(used|max)_bytes|jvm_gc_collection_seconds_(count|sum)|jvm_threads_current|process_cpu_seconds_total|process_open_fds"}'
        action: drop
  # The provisioner, whose source controller exports what it reads of each
  # Postgres CDC source's slot and phase (changeport_source_*), each series
  # with its own tenant and source labels, which this job keeps.
  - job_name: changeport-provisioner
    honor_labels: true
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [changeport]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
        regex: changeport-provisioner;metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance
    metric_relabel_configs:
      # On dedicated clusters the Kafka cluster is named after the tenant.
      - source_labels: [tenant]
        regex: (.+)
        target_label: cluster
      # The controllers' own health besides; not Go's or the workqueues'.
      - if: '{__name__!~"changeport_.*|controller_runtime_reconcile_(errors_)?total"}'
        action: drop
