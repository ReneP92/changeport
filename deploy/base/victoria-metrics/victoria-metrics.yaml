apiVersion: v1
kind: Namespace
metadata:
  name: metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoria-metrics
---
# Pod discovery across all namespaces, to find the customers' brokers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: changeport-victoria-metrics
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: changeport-victoria-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: changeport-victoria-metrics
subjects:
  - kind: ServiceAccount
    name: victoria-metrics
    namespace: metrics
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoria-metrics-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
spec:
  replicas: 1
  # One pod at a time owns the data volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-metrics
    spec:
      serviceAccountName: victoria-metrics
      containers:
        - name: victoria-metrics
          image: victoriametrics/victoria-metrics:v1.154.1
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=30d
            - -promscrape.config=/config/scrape.yaml
          env:
            - name: CHANGEPORT_ENV
              value: kind
          ports:
            - name: http
              containerPort: 8428
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: victoria-metrics-data
        - name: config
          configMap:
            name: victoria-metrics-scrape
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
spec:
  selector:
    app.kubernetes.io/name: victoria-metrics
  ports:
    - name: http
      port: 8428
      targetPort: http
