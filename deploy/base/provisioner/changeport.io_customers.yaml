---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: customers.changeport.io
spec:
  group: changeport.io
  names:
    kind: Customer
    listKind: CustomerList
    plural: customers
    singular: customer
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display name
      type: string
    - jsonPath: .spec.profile
      name: Profile
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Customer is a customer of Changeport and their dedicated Kafka cluster.
          Its name is the customer ID, which names the namespace customer-<name> and
          the cluster's public names, so it follows the rules of
          provisioning.ValidateCustomerID.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CustomerSpec is what Changeport runs for a customer.
            properties:
              clerkOrganizationID:
                description: |-
                  ClerkOrganizationID is the Clerk organization whose members sign in to
                  the console as this customer, if any.
                maxLength: 63
                pattern: ^org_[A-Za-z0-9]+$
                type: string
              deletionProtection:
                description: |-
                  DeletionProtection, when true, keeps the customer's Kafka cluster when
                  the Customer is deleted: the controller deprovisions it only once
                  protection is turned off.
                type: boolean
              displayName:
                description: |-
                  DisplayName is the customer's name as people know it, such as "Acme
                  Corp".
                maxLength: 100
                minLength: 1
                type: string
              profile:
                description: |-
                  Profile sizes the customer's dedicated Kafka cluster. It cannot change:
                  moving a cluster to another profile is a migration, not an edit.
                enum:
                - dev
                - dev-ha
                - production
                type: string
                x-kubernetes-validations:
                - message: the profile cannot change
                  rule: self == oldSelf
            required:
            - displayName
            - profile
            type: object
          status:
            description: CustomerStatus is how far the customer's Kafka cluster is.
            properties:
              bootstrapAddress:
                description: |-
                  BootstrapAddress is the public address the customer's clients
                  bootstrap from, as host:port.
                type: string
              conditions:
                description: |-
                  Conditions are CertificateIssued, KafkaReady, UsersReady,
                  AgentAvailable and Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the generation of the Customer the conditions
                  describe.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'the name is the customer ID: at most 30 lowercase letters, digits
            and dashes, starting with a letter and ending with a letter or digit'
          rule: size(self.metadata.name) <= 30 && self.metadata.name.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
