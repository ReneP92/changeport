apiVersion: v1
kind: Namespace
metadata:
  name: object-store
---
# The store's keys, also set on the kind platform in internal/provisioning
# (KindPlatform). They only guard a throwaway store inside the local cluster.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-credentials
stringData:
  AWS_ACCESS_KEY_ID: changeport
  AWS_SECRET_ACCESS_KEY: changeport-local-only
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  # One pod at a time owns the data volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          # 100 MB volumes instead of 1 GB: local tests store megabytes, and
          # SeaweedFS only creates a volume when the disk has room for it.
          args: [mini, -dir=/data, -master.volumeSizeLimitMB=100]
          env:
            # Created at startup if missing; the bucket of the kind platform.
            - name: S3_BUCKET
              value: changeport-tiered-storage
          envFrom:
            - secretRef:
                name: seaweedfs-credentials
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
