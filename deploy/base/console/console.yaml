apiVersion: v1
kind: ServiceAccount
metadata:
  name: changeport-console
  namespace: changeport
---
# The console reads Customers, and creates and deletes them for operators;
# the provisioning controller does the rest. It cannot change a Customer, so
# it cannot turn deletion protection off. In each customer namespace the
# template's Role lets it read the Secrets it needs, by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: changeport-console
rules:
  - apiGroups: [changeport.io]
    resources: [customers]
    verbs: [get, list, create, delete]
  # Customers' Postgres CDC sources, in their namespaces.
  - apiGroups: [changeport.io]
    resources: [postgressources]
    verbs: [get, list, create, update, patch, delete]
  # Only the sources' write-once password Secrets, which the admission
  # policy changeport-console-secrets narrows this to.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: changeport-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: changeport-console
subjects:
  - kind: ServiceAccount
    name: changeport-console
    namespace: changeport
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changeport-console
  namespace: changeport
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: changeport-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: changeport-console
    spec:
      serviceAccountName: changeport-console
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: changeport/console:local
          args:
            - -listen=:8080
          env:
            # The origins the web app is served from, which session tokens
            # must name; overlays set them.
            - name: CHANGEPORT_CONSOLE_ORIGINS
              value: ""
            - name: CHANGEPORT_METRICS_URL
              value: http://victoria-metrics.metrics.svc:8428
            # The addresses customers' databases see Changeport connect
            # from, which they allowlist: the NAT gateways' (Terraform's
            # nat_public_ips), which hack/platform-apply.sh writes into the
            # ConfigMap changeport-egress. None on kind.
            - name: CHANGEPORT_EGRESS_IPS
              valueFrom:
                configMapKeyRef: { name: changeport-egress, key: addresses, optional: true }
          envFrom:
            # The Clerk keys and the staff organization. Without them the
            # console starts, and refuses every API call.
            - secretRef:
                name: changeport-console-clerk
                optional: true
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: changeport-console
  namespace: changeport
spec:
  selector:
    app.kubernetes.io/name: changeport-console
  ports:
    - name: http
      port: 80
      targetPort: http
