apiVersion: v1
kind: ServiceAccount
metadata:
  name: changeport-console
  namespace: changeport
---
# The console reads Customers. In each customer namespace the template's
# Role lets it read the Secrets it needs, by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: changeport-console
rules:
  - apiGroups: [changeport.io]
    resources: [customers]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: changeport-console
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: changeport-console
subjects:
  - kind: ServiceAccount
    name: changeport-console
    namespace: changeport
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changeport-console
  namespace: changeport
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: changeport-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: changeport-console
    spec:
      serviceAccountName: changeport-console
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: changeport/console:local
          args:
            - -listen=:8080
          env:
            # The origins the web app is served from, which session tokens
            # must name; overlays set them.
            - name: CHANGEPORT_CONSOLE_ORIGINS
              value: ""
          envFrom:
            # The Clerk keys and the staff organization. Without them the
            # console starts, and refuses every API call.
            - secretRef:
                name: changeport-console-clerk
                optional: true
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: changeport-console
  namespace: changeport
spec:
  selector:
    app.kubernetes.io/name: changeport-console
  ports:
    - name: http
      port: 80
      targetPort: http
