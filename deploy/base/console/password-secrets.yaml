# The console may create Secrets (deploy/base/console/console.yaml), as RBAC
# cannot scope creating by name; this policy narrows that to the write-once
# password Secrets of customers' Postgres CDC sources (docs/cdc.md): of their
# own type, named postgres-password-, immutable, holding only the password,
# in a customer's namespace. The source controller moves the password on and
# deletes the Secret; the console can never read, change or delete it, nor
# any other Secret.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: changeport-console-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [secrets]
  matchConditions:
    - name: the-console
      expression: request.userInfo.username == 'system:serviceaccount:changeport:changeport-console'
  validations:
    - expression: request.operation == 'CREATE'
      message: the console may only create Secrets
      reason: Forbidden
    - expression: >-
        request.operation != 'CREATE' || (
        request.namespace.startsWith('customer-') &&
        object.metadata.name.startsWith('postgres-password-') &&
        object.type == 'changeport.io/postgres-password' &&
        has(object.immutable) && object.immutable &&
        has(object.data) && object.data.size() == 1 && 'password' in object.data)
      message: >-
        the console may only create a Postgres source's password Secret: named postgres-password-,
        of type changeport.io/postgres-password, immutable, holding only the password, in a
        customer's namespace
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: changeport-console-secrets
spec:
  policyName: changeport-console-secrets
  validationActions: [Deny]
