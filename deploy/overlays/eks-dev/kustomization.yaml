# Platform components of the EKS cluster in the dev account, applied by
# make platform-apply ENV=dev.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/strimzi
  - ../../base/cert-manager
  - ../../base/provisioner
  - ../../base/eks-storage
  - ../../base/victoria-metrics
patches:
  # The environment of every metric.
  - target:
      kind: Deployment
      name: victoria-metrics
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev
