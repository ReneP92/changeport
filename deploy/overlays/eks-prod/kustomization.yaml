# Platform components of the EKS cluster in the prod account, applied by
# CONFIRM=prod just platform-apply prod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/strimzi
  - ../../base/cert-manager
  - ../../base/provisioner
  - ../../base/console
  - ../../base/eks-storage
  - ../../base/victoria-metrics
patches:
  # Nothing to run until the console's image is in ECR and it has an
  # ingress and a Clerk production instance (#58).
  - target:
      kind: Deployment
      name: changeport-console
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # The platform the provisioner provisions customers on.
  - target:
      kind: Deployment
      name: changeport-provisioner
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: -platform=eks-prod
      # Nothing to run until the provisioner image is in ECR (#18).
      - op: replace
        path: /spec/replicas
        value: 0
  # The environment of every metric.
  - target:
      kind: Deployment
      name: victoria-metrics
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: prod
  # Keep a customer's volumes when their claims are deleted, so a mistaken
  # deprovision loses no data. A StorageClass is immutable: changing this on
  # a running cluster means deleting and recreating the class.
  - target:
      kind: StorageClass
      name: gp3
    patch: |-
      - op: replace
        path: /reclaimPolicy
        value: Retain
