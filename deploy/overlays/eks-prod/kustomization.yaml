# Platform components of the EKS cluster in the prod account, applied by
# make platform-apply ENV=prod CONFIRM=prod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/strimzi
  - ../../base/cert-manager
  - ../../base/eks-storage
  - ../../base/victoria-metrics
patches:
  # The environment of every metric.
  - target:
      kind: Deployment
      name: victoria-metrics
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: prod
  # Keep a customer's volumes when their claims are deleted, so a mistaken
  # deprovision loses no data. A StorageClass is immutable: changing this on
  # a running cluster means deleting and recreating the class.
  - target:
      kind: StorageClass
      name: gp3
    patch: |-
      - op: replace
        path: /reclaimPolicy
        value: Retain
