# Platform components of the local kind cluster. Applied first by
# hack/platform-apply.sh; config/ follows once the operators are ready.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/strimzi
  - ../../base/cert-manager
  - ../../base/provisioner
  - ../../base/object-store
  - ../../base/victoria-metrics
patches:
  # The platform the provisioner provisions customers on.
  - target:
      kind: Deployment
      name: changeport-provisioner
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: -platform=kind
