# Publishes the platform's own images to ECR in the prod account
# (terraform/modules/ecr) for amd64 and arm64 when their sources change on
# main, tagged with the commit, and proposes running them on EKS: a pull
# request from the bot/eks-images branch that changes their digests in
# internal/provisioning/eks-images.json and deploy/components/eks-images
# (cmd/eksimages). Merging it is what changes the images EKS runs.
#
# It needs, once the prod account exists (#10):
# - the repository variable ECR_PUSH_ROLE_ARN, the image_push_role_arn output
#   of terraform/environments/prod; until it is set, nothing runs;
# - "Allow GitHub Actions to create and approve pull requests" in the
#   repository's Actions settings, for the pull request.
name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time, each to completion, so pull requests follow main.
concurrency:
  group: publish-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    name: Images to publish
    if: vars.ECR_PUSH_ROLE_ARN != ''
    runs-on: ubuntu-26.04
    outputs:
      images: ${{ steps.changed.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A manual run publishes every image.
      - id: changed
        env:
          FROM: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: echo "images=$(hack/changed-images.sh ${FROM:+"$FROM"} "$GITHUB_SHA")" >>"$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      # The Kafka image's last stage runs a command, which needs emulation to
      # build for arm64 here.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push
        env:
          IMAGE: ${{ matrix.image }}
          REPOSITORY: ${{ steps.ecr.outputs.registry }}/changeport/${{ matrix.image }}
        run: |
          # The Kafka image builds from its own directory, the others from
          # the repository root.
          if [[ $IMAGE == kafka ]]; then build=(images/kafka); else build=(-f "images/$IMAGE/Dockerfile" .); fi
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t "$REPOSITORY:$GITHUB_SHA" --metadata-file metadata.json "${build[@]}"
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          [[ $digest == sha256:* ]] || { echo "no digest in the build metadata" >&2; exit 1; }
          mkdir -p published
          echo "$IMAGE=$REPOSITORY@$digest" >"published/$IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.image }}
          path: published/${{ matrix.image }}
          retention-days: 7

  propose:
    name: Propose running them on EKS
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: published-*
          path: published
          merge-multiple: true
      # An open pull request may propose images published earlier; they stay,
      # unless published again now.
      - name: Set the images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          proposal=""
          if gh pr view bot/eks-images --json state -q .state 2>/dev/null | grep -qx OPEN; then
            git fetch -q origin bot/eks-images
            proposal=origin/bot/eks-images
          fi
          hack/set-published-images.sh published ${proposal:+"$proposal"}
      # Pull requests GITHUB_TOKEN opens do not run CI, so the checks that
      # cover these files run here.
      - name: Check
        run: go test ./internal/provisioning/ ./cmd/eksimages/
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "The published images are the ones EKS already runs."
            exit 0
          fi
          short=${GITHUB_SHA:0:7}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C bot/eks-images
          git commit -qam "Run the images published from $short on EKS"
          git push -f origin bot/eks-images
          body="The images published from $GITHUB_SHA by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, by digest. Merging this is what makes the EKS platforms run them.

          $(cat published/* | sed 's/^/- /')"
          if gh pr view bot/eks-images --json state -q .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit bot/eks-images --title "Run the images published from $short on EKS" --body "$body"
          else
            gh pr create --head bot/eks-images --base main --title "Run the images published from $short on EKS" --body "$body"
          fi
