name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs CI on demand, for example to check the end-to-end job for flakiness.
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the run it supersedes; runs started by hand each get
# their own group, so several can run side by side.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  go:
    name: Go lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Check that the Go modules are tidy
        run: |
          go mod tidy -diff
          go -C tools mod tidy -diff
      - name: Check that the generated code is up to date
        run: |
          make generate
          git diff --exit-code
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: make tf-fmt
      - run: make tf-validate

  shell:
    name: Shell scripts and text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make shellcheck
      - run: make check-text

  # The pinned, checksum-verified Bun from hack/lib.sh runs everything, as it
  # does on a laptop, so no Node or setup action is involved.
  web:
    name: Web lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make web-check
      - run: make web-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-e2e-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  e2e:
    name: End to end on kind
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make dev-up
      - run: make e2e
      - run: make platform-check
      - name: Collect diagnostics
        if: failure()
        run: hack/diagnostics.sh diagnostics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-diagnostics
          path: diagnostics
          retention-days: 14

  # The console signed in as Clerk test users, on its own kind cluster. It
  # needs the Clerk development instance: the secret CLERK_SECRET_KEY and the
  # variables CLERK_PUBLISHABLE_KEY and CHANGEPORT_STAFF_ORG_ID. Where the
  # secret is not available, such as in pull requests from forks, it skips
  # with a notice.
  console-e2e:
    name: Console end to end with Clerk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CHANGEPORT_STAFF_ORG_ID: ${{ vars.CHANGEPORT_STAFF_ORG_ID }}
    steps:
      - id: clerk
        name: Check for the Clerk test instance
        run: |
          if [ -z "$CLERK_SECRET_KEY" ] || [ -z "$CLERK_PUBLISHABLE_KEY" ] || [ -z "$CHANGEPORT_STAFF_ORG_ID" ]; then
            echo "::notice title=Console end to end skipped::The Clerk test instance is not available to this run, so the signed-in console tests did not run."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.clerk.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.clerk.outputs.available == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Give the console its Clerk configuration
        if: steps.clerk.outputs.available == 'true'
        run: |
          umask 077
          printf 'CLERK_PUBLISHABLE_KEY=%s\nCLERK_SECRET_KEY=%s\nCHANGEPORT_STAFF_ORG_ID=%s\n' \
            "$CLERK_PUBLISHABLE_KEY" "$CLERK_SECRET_KEY" "$CHANGEPORT_STAFF_ORG_ID" > .env
      - if: steps.clerk.outputs.available == 'true'
        run: make dev-up
      - if: steps.clerk.outputs.available == 'true'
        run: make ui-e2e
      - name: Collect diagnostics
        if: failure() && steps.clerk.outputs.available == 'true'
        run: hack/diagnostics.sh diagnostics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.clerk.outputs.available == 'true'
        with:
          name: console-e2e
          path: |
            diagnostics
            web/playwright-report
            web/test-results
          retention-days: 14

  kafka-image:
    name: Kafka image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The docker-container driver builds for several platforms at once.
      - run: docker buildx create --use --driver docker-container
      - name: Build for amd64 and arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 images/kafka
      - name: Load the amd64 image
        run: docker buildx build --load -t changeport/kafka:local images/kafka
      - run: make kafka-image-test

  provisioner-image:
    name: Provisioner image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The docker-container driver builds for several platforms at once.
      - run: docker buildx create --use --driver docker-container
      - name: Build for amd64 and arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 -f images/provisioner/Dockerfile .

  console-image:
    name: Console image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The docker-container driver builds for several platforms at once.
      - run: docker buildx create --use --driver docker-container
      - name: Build for amd64 and arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 -f images/console/Dockerfile .

  agent-image:
    name: Agent image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The docker-container driver builds for several platforms at once.
      - run: docker buildx create --use --driver docker-container
      - name: Build for amd64 and arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 -f images/agent/Dockerfile .
