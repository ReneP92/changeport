name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Check that the Go modules are tidy
        run: |
          go mod tidy -diff
          go -C tools mod tidy -diff
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: make tf-fmt
      - run: make tf-validate

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make shellcheck

  platform:
    name: Platform overlays on kind
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make platform-check

  kafka-image:
    name: Kafka image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The docker-container driver builds for several platforms at once.
      - run: docker buildx create --use --driver docker-container
      - name: Build for amd64 and arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 images/kafka
      - name: Load the amd64 image
        run: docker buildx build --load -t changeport/kafka:local images/kafka
      - run: make kafka-image-test

  agent-image:
    name: Agent image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The docker-container driver builds for several platforms at once.
      - run: docker buildx create --use --driver docker-container
      - name: Build for amd64 and arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 -f images/agent/Dockerfile .
