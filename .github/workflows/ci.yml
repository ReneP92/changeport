name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runs CI on demand, for example to check the end-to-end job for flakiness.
  workflow_dispatch:

permissions:
  contents: read

# Runners are pinned, like everything else.

# A new push cancels the run it supersedes; runs started by hand each get
# their own group, so several can run side by side.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  go:
    name: Go lint and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Check that the Go modules are tidy
        run: |
          go mod tidy -diff
          go -C tools mod tidy -diff
      - name: Check that the generated code is up to date
        run: |
          just generate
          git diff --exit-code
      - name: Lint
        run: just lint
      - name: Test
        run: just test

  # The just recipes download the Terraform that hack/lib.sh pins, as on a
  # laptop.
  terraform:
    name: Terraform format, validate and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - run: just tf-fmt
      - run: just tf-validate
      - run: just tf-test

  shell:
    name: Shell scripts and text
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - run: just shellcheck
      - run: just check-text

  # The pinned, checksum-verified Bun from hack/lib.sh runs everything, as it
  # does on a laptop, so no Node or setup action is involved.
  web:
    name: Web lint, test and build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      # The pinned tools in bin/ and Playwright's browser, until a pin changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/
            !bin/*.kubeconfig
            ~/.cache/ms-playwright
          key: tools-${{ runner.os }}-${{ hashFiles('hack/lib.sh', 'tools/go.sum', 'web/bun.lock') }}
      - run: just web-check
      - run: just web-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-e2e-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  # The end-to-end suites on kind, each on a cluster of its own: the failover
  # suite freezes a zone, which would disturb the core suite's tests.
  e2e:
    name: End to end on kind (${{ matrix.suite }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [core, failover]
    env:
      BUILD_CACHE: gha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # Docker layers come from and go to GitHub Actions' cache (BUILD_CACHE),
      # which needs BuildKit's container driver and the runtime's token.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # The pinned tools in bin/ and Playwright's browser, until a pin changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/
            !bin/*.kubeconfig
            ~/.cache/ms-playwright
          key: tools-${{ runner.os }}-${{ hashFiles('hack/lib.sh', 'tools/go.sum', 'web/bun.lock') }}
      # The failover suite brings its own customer.
      - run: just dev-up
        env:
          DEMO_CUSTOMER: ${{ matrix.suite == 'core' && 'demo' || '' }}
      - run: just e2e ${{ matrix.suite }}
      - if: matrix.suite == 'core'
        run: just platform-check
      - name: Collect diagnostics
        if: failure()
        run: hack/diagnostics.sh diagnostics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-diagnostics-${{ matrix.suite }}
          path: diagnostics
          retention-days: 14

  # The console signed in as Clerk test users, on its own kind cluster. It
  # needs the Clerk development instance: the secret CLERK_SECRET_KEY and the
  # variables CLERK_PUBLISHABLE_KEY and CHANGEPORT_STAFF_ORG_ID. Where the
  # secret is not available, such as in pull requests from forks, it skips
  # with a notice.
  console-e2e:
    name: Console end to end with Clerk
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CHANGEPORT_STAFF_ORG_ID: ${{ vars.CHANGEPORT_STAFF_ORG_ID }}
      BUILD_CACHE: gha
    steps:
      - id: clerk
        name: Check for the Clerk test instance
        run: |
          if [ -z "$CLERK_SECRET_KEY" ] || [ -z "$CLERK_PUBLISHABLE_KEY" ] || [ -z "$CHANGEPORT_STAFF_ORG_ID" ]; then
            echo "::notice title=Console end to end skipped::The Clerk test instance is not available to this run, so the signed-in console tests did not run."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.clerk.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.clerk.outputs.available == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - if: steps.clerk.outputs.available == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Give the console its Clerk configuration
        if: steps.clerk.outputs.available == 'true'
        run: |
          umask 077
          printf 'CLERK_PUBLISHABLE_KEY=%s\nCLERK_SECRET_KEY=%s\nCHANGEPORT_STAFF_ORG_ID=%s\n' \
            "$CLERK_PUBLISHABLE_KEY" "$CLERK_SECRET_KEY" "$CHANGEPORT_STAFF_ORG_ID" > .env
      # Docker layers come from and go to GitHub Actions' cache (BUILD_CACHE),
      # which needs BuildKit's container driver and the runtime's token.
      - if: steps.clerk.outputs.available == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.clerk.outputs.available == 'true'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # The pinned tools in bin/ and Playwright's browser, until a pin changes.
      - if: steps.clerk.outputs.available == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/
            !bin/*.kubeconfig
            ~/.cache/ms-playwright
          key: tools-${{ runner.os }}-${{ hashFiles('hack/lib.sh', 'tools/go.sum', 'web/bun.lock') }}
      # The signed-in tests create customers of their own.
      - if: steps.clerk.outputs.available == 'true'
        run: just dev-up
        env:
          DEMO_CUSTOMER: ""
      - if: steps.clerk.outputs.available == 'true'
        run: just ui-e2e
      - name: Collect diagnostics
        if: failure() && steps.clerk.outputs.available == 'true'
        run: hack/diagnostics.sh diagnostics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.clerk.outputs.available == 'true'
        with:
          name: console-e2e
          path: |
            diagnostics
            web/playwright-report
            web/test-results
          retention-days: 14

  kafka-image:
    name: Kafka image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      # The image's last stage runs one command (removing the jars it
      # replaces), which needs emulation to build for arm64 here.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      # BuildKit's container driver builds for several platforms at once, with
      # the layers cached in GitHub Actions' cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build for amd64 and arm64
        run: >-
          docker buildx build --platform linux/amd64,linux/arm64
          --cache-from type=gha,scope=kafka-multiarch --cache-to type=gha,mode=max,scope=kafka-multiarch
          images/kafka
      - name: Load the amd64 image
        run: docker buildx build --load -t changeport/kafka:local images/kafka
      - run: just kafka-image-test

  connect-image:
    name: Connect image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      # BuildKit's container driver builds for several platforms at once, with
      # the layers cached in GitHub Actions' cache. The image has no RUN in its
      # last stage, so arm64 needs no emulation.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build for amd64 and arm64
        run: >-
          docker buildx build --platform linux/amd64,linux/arm64
          --cache-from type=gha,scope=connect-multiarch --cache-to type=gha,mode=max,scope=connect-multiarch
          images/connect
      - name: Load the amd64 image
        run: docker buildx build --load -t changeport/connect:local images/connect
      - run: just connect-image-test

  provisioner-image:
    name: Provisioner image
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BuildKit's container driver builds for several platforms at once, with
      # the layers cached in GitHub Actions' cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build for amd64 and arm64
        run: >-
          docker buildx build --platform linux/amd64,linux/arm64
          --cache-from type=gha,scope=provisioner-multiarch --cache-to type=gha,mode=max,scope=provisioner-multiarch
          -f images/provisioner/Dockerfile .

  console-image:
    name: Console image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BuildKit's container driver builds for several platforms at once, with
      # the layers cached in GitHub Actions' cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build for amd64 and arm64
        run: >-
          docker buildx build --platform linux/amd64,linux/arm64
          --cache-from type=gha,scope=console-multiarch --cache-to type=gha,mode=max,scope=console-multiarch
          -f images/console/Dockerfile .

  agent-image:
    name: Agent image
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BuildKit's container driver builds for several platforms at once, with
      # the layers cached in GitHub Actions' cache.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build for amd64 and arm64
        run: >-
          docker buildx build --platform linux/amd64,linux/arm64
          --cache-from type=gha,scope=agent-multiarch --cache-to type=gha,mode=max,scope=agent-multiarch
          -f images/agent/Dockerfile .
