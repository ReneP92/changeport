apiVersion: v1
kind: Namespace
metadata:
  name: customer-acme
  labels:
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
---
# The keys of the local object store, for the brokers' tiered storage.
apiVersion: v1
kind: Secret
metadata:
  name: tiered-storage-credentials
  namespace: customer-acme
  labels:
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
stringData:
  AWS_ACCESS_KEY_ID: "changeport"
  AWS_SECRET_ACCESS_KEY: "changeport-local-only"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: external-listener
  namespace: customer-acme
  labels:
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  # One wildcard name covers the bootstrap name and every broker's name.
  dnsNames:
    - "*.acme.kafka.changeport.test"
  secretName: external-listener-tls
  privateKey:
    algorithm: ECDSA
    size: 256
    # Kafka only loads PEM private keys in PKCS#8.
    encoding: PKCS8
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: local-ca
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: customer-acme
  labels:
    strimzi.io/cluster: "acme"
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  replicas: 1
  roles:
    - controller
    - broker
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      memory: "1Gi"
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: "5Gi"
        class: "standard"
        deleteClaim: false
        kraftMetadata: shared
  template:
    pod:
      volumes:
        # The tiered storage plugin's cache of chunks fetched back from S3.
        - name: tiered-storage-cache
          emptyDir:
            sizeLimit: 3Gi
      affinity:
        # One broker per node.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {strimzi.io/cluster: "acme", strimzi.io/pool-name: dual-role}}
    kafkaContainer:
      volumeMounts:
        - name: tiered-storage-cache
          mountPath: /mnt/tiered-storage-cache
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef: {name: tiered-storage-credentials, key: AWS_ACCESS_KEY_ID}
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef: {name: tiered-storage-credentials, key: AWS_SECRET_ACCESS_KEY}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: "acme"
  namespace: customer-acme
  labels:
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    image: changeport/kafka:local
    listeners:
      # Platform clients inside the cluster, such as the Kafka agent.
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
      # Customers, over the internet.
      - name: external
        port: 9094
        type: loadbalancer
        tls: true
        authentication:
          type: scram-sha-512
        configuration:
          externalTrafficPolicy: Local
          brokerCertChainAndKey:
            secretName: external-listener-tls
            certificate: tls.crt
            key: tls.key
          bootstrap:
            annotations:
              external-dns.alpha.kubernetes.io/hostname: "bootstrap.acme.kafka.changeport.test"
          advertisedHostTemplate: b{nodeId}.acme.kafka.changeport.test
          perBrokerAnnotationsTemplate:
            external-dns.alpha.kubernetes.io/hostname: "b{nodeId}.acme.kafka.changeport.test"
    authorization:
      type: simple
    # Broker metrics on port 9404, which VictoriaMetrics scrapes with the
    # tenant label (docs/metrics-labels.md). Only what observability and
    # usage metering need, to keep the number of series per broker low. The
    # patterns match names before Prometheus appends _total to counters; JVM
    # and process metrics are always exported and trimmed when scraped. The
    # metrics clients push (KIP-714) come out of the same reporter as
    # clients_* series, which the allowList does not apply to; the Kafka
    # agent sets up which ones and how they are labelled.
    metricsConfig:
      type: strimziMetricsReporter
      values:
        allowList:
          # Health: replication, controller, offline storage.
          - "kafka_server_replicamanager_(underreplicatedpartitions|underminisrpartitioncount|atminisrpartitioncount|offlinereplicacount|leadercount|partitioncount|isrshrinkspersec|isrexpandspersec|failedisrupdatespersec)"
          - "kafka_controller_kafkacontroller_(activecontrollercount|activebrokercount|fencedbrokercount|offlinepartitionscount|globalpartitioncount|globaltopiccount|preferredreplicaimbalancecount)"
          - "kafka_log_logmanager_offlinelogdirectorycount"
          - "kafka_server_kafkaserver_brokerstate"
          # Usage per topic: traffic, storage on the brokers and in S3.
          - "kafka_server_brokertopicmetrics_(bytesin|bytesout|messagesin|bytesrejected|totalproducerequests|totalfetchrequests|failedproducerequests|failedfetchrequests|remotecopybytes|remotecopyerrors|remotefetchbytes|remotefetcherrors)persec"
          - "kafka_server_brokertopicmetrics_(remotecopylagbytes|remotecopylagsegments|remotelogsizebytes)"
          - "kafka_log_log_size"
          # Load: requests, latency, connections, thread saturation.
          - "kafka_network_requestmetrics_requestspersec"
          - "kafka_network_requestmetrics_totaltimems.*"
          - "kafka_network_socketserver_networkprocessoravgidlepercent"
          - "kafka_server_kafkarequesthandlerpool_requesthandleravgidlepercent"
          - "kafka_server_socket_server_metrics_connection_count"
          - "kafka_coordinator_group_groupmetadatamanager_numgroups.*"
    # Topic history goes to S3 through the Aiven plugin in the Kafka image
    # (images/kafka). Topics opt in with remote.storage.enable=true.
    tieredStorage:
      type: custom
      remoteStorageManager:
        className: io.aiven.kafka.tieredstorage.RemoteStorageManager
        classPath: /opt/kafka/plugins/tiered-storage/*
        config:
          storage.backend.class: io.aiven.kafka.tieredstorage.storage.s3.S3Storage
          storage.s3.bucket.name: "changeport-tiered-storage"
          storage.s3.region: "us-east-1"
          storage.s3.endpoint.url: "http://seaweedfs.object-store.svc:8333"
          storage.s3.path.style.access.enabled: "true"
          key.prefix: "customer-acme/"
          chunk.size: "4194304"
          fetch.chunk.cache.class: io.aiven.kafka.tieredstorage.fetch.cache.DiskChunkCache
          fetch.chunk.cache.path: /mnt/tiered-storage-cache
          # 2 GiB, inside the cache volume's 3 GiB.
          fetch.chunk.cache.size: "2147483648"
    config:
      auto.create.topics.enable: false
      # Tiered topics keep a day on the brokers' disks; the rest is in S3.
      log.local.retention.ms: 86400000
      rlmm.config.remote.log.metadata.topic.replication.factor: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      log.retention.check.interval.ms: "15000"
      remote.log.manager.task.interval.ms: "5000"
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
# The customer's user. It manages topics, consumer groups and transactions,
# but cannot change the cluster's configuration, which the platform owns.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: admin
  namespace: customer-acme
  labels:
    strimzi.io/cluster: "acme"
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations: [All]
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations: [All]
      - resource:
          type: transactionalId
          name: "*"
          patternType: literal
        operations: [All]
      - resource:
          type: cluster
        operations: [Describe, DescribeConfigs, IdempotentWrite]
---
# The Kafka agent's user on the internal listener: it reads the cluster,
# keeps topic settings such as tiered storage in place, and reads consumer
# groups' committed offsets to measure their lag. It cannot read messages.
# It also keeps client telemetry in place, a client metrics subscription and
# a dynamic broker config, both of which Kafka authorizes as cluster configs.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: changeport-agent
  namespace: customer-acme
  labels:
    strimzi.io/cluster: "acme"
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations: [Describe, DescribeConfigs, AlterConfigs]
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations: [Describe]
      - resource:
          type: cluster
        operations: [Describe, DescribeConfigs, AlterConfigs]
---
# The console's user on the internal listener: it manages the customer's
# topics within the platform's guardrails, reads cluster metadata and which
# consumer groups read a topic, and cannot read or write messages.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: changeport-console
  namespace: customer-acme
  labels:
    strimzi.io/cluster: "acme"
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations: [Create, Delete, Describe, DescribeConfigs]
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations: [Describe]
      - resource:
          type: cluster
        operations: [Describe]
---
# Lets the console's service account read the Secrets it needs in this
# namespace, by name, and the pods, to show the brokers' health.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: changeport-console
  namespace: customer-acme
  labels:
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - "changeport-console"
      - "acme-cluster-ca-cert"
      - "admin"
      - "external-listener-tls"
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: changeport-console
  namespace: customer-acme
  labels:
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: changeport-console
subjects:
  - kind: ServiceAccount
    name: changeport-console
    namespace: changeport
---
# The Kafka agent (cmd/agent) keeps the platform's topic settings in place:
# it turns on tiered storage for every topic that can use it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changeport-agent
  namespace: customer-acme
  labels:
    app.kubernetes.io/name: changeport-agent
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: changeport-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: changeport-agent
        changeport.io/tenant: "acme"
        changeport.io/kafka-cluster: "acme"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: changeport/agent:local
          args:
            - "-bootstrap=acme-kafka-bootstrap.customer-acme.svc:9093"
            - "-client-metrics-interval=5s"
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: agent-user
              mountPath: /etc/changeport/agent-user
              readOnly: true
            - name: cluster-ca
              mountPath: /etc/changeport/cluster-ca
              readOnly: true
      volumes:
        # The certificate of the agent's KafkaUser, from the User Operator.
        - name: agent-user
          secret:
            secretName: changeport-agent
        - name: cluster-ca
          secret:
            secretName: acme-cluster-ca-cert
---
# The Kafka Connect worker's user on the internal listener, for the customer's
# Postgres CDC sources (docs/cdc.md). It creates and writes each source's
# topics, but never reads the customer's topics.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: changeport-connect
  namespace: customer-acme
  labels:
    strimzi.io/cluster: "acme"
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      # Connect's own topics, of connector configurations, offsets and status,
      # and its group.
      - resource:
          type: topic
          name: changeport.connect.
          patternType: prefix
        operations: [Create, Describe, DescribeConfigs, Read, Write]
      - resource:
          type: group
          name: changeport.connect
          patternType: literal
        operations: [Describe, Read]
      # The sources' snapshot signals, progress notifications and heartbeats.
      - resource:
          type: topic
          name: changeport.cdc.
          patternType: prefix
        operations: [Create, Describe, DescribeConfigs, Read, Write]
      - resource:
          type: group
          name: changeport.cdc.
          patternType: prefix
        operations: [Describe, Read]
      # The topics of source app's tables.
      - resource:
          type: topic
          name: "app."
          patternType: prefix
        operations: [Create, Describe, DescribeConfigs, Write]
      # The topics of source billing's tables.
      - resource:
          type: topic
          name: "billing."
          patternType: prefix
        operations: [Create, Describe, DescribeConfigs, Write]
      - resource:
          type: cluster
        operations: [Describe, DescribeConfigs]
---
# The schema registry's user on the internal listener: it keeps its schemas
# in its own topics, and touches nothing else.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: changeport-registry
  namespace: customer-acme
  labels:
    strimzi.io/cluster: "acme"
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: changeport.registry.
          patternType: prefix
        operations: [Create, Describe, DescribeConfigs, Read, Write]
      - resource:
          type: group
          name: changeport.registry.
          patternType: prefix
        operations: [Describe, Read]
      - resource:
          type: cluster
        operations: [Describe, DescribeConfigs]
---
# The Kafka Connect worker that runs the customer's Postgres CDC sources, one
# KafkaConnector each, with Debezium and Apicurio's Avro converter
# (images/connect).
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: changeport-connect
  namespace: customer-acme
  labels:
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 4.3.1
  image: changeport/connect:local
  replicas: 1
  bootstrapServers: "acme-kafka-bootstrap:9093"
  groupId: changeport.connect
  configStorageTopic: changeport.connect.configs
  offsetStorageTopic: changeport.connect.offsets
  statusStorageTopic: changeport.connect.status
  tls:
    trustedCertificates:
      - secretName: acme-cluster-ca-cert
        certificate: ca.crt
  authentication:
    type: tls
    certificateAndKey:
      secretName: changeport-connect
      certificate: user.crt
      key: user.key
  config:
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
    # Connector configurations name the files of the mounted Secrets rather
    # than holding passwords: ${directory:/mnt/sources:<source>}.
    config.providers: directory
    config.providers.directory.class: org.apache.kafka.common.config.provider.DirectoryConfigProvider
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      memory: "1Gi"
  # Strimzi's default heap of three quarters of the memory leaves too little
  # for the rest of the worker.
  jvmOptions:
    "-Xms": "512m"
    "-Xmx": "512m"
  template:
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {strimzi.io/cluster: "acme", strimzi.io/pool-name: dual-role}}
      volumes:
        # The sources' database passwords, which the source controller writes.
        - name: sources
          secret:
            secretName: changeport-connect-sources
            optional: true
        # The worker's own certificate and the cluster CA, for the clients
        # Debezium starts itself, such as the snapshot signal consumer.
        - name: connect-user
          secret:
            secretName: changeport-connect
        - name: cluster-ca
          secret:
            secretName: acme-cluster-ca-cert
    connectContainer:
      volumeMounts:
        - name: sources
          mountPath: /mnt/sources
        - name: connect-user
          mountPath: /mnt/connect-user
        - name: cluster-ca
          mountPath: /mnt/cluster-ca
---
# Source app's snapshot signals: the source controller asks for the
# existing rows of its tables here, and the connector reads them.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: changeport.cdc.signals.app
  namespace: customer-acme
  labels:
    strimzi.io/cluster: "acme"
    changeport.io/source: app
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  topicName: changeport.cdc.signals.app
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: delete
    retention.ms: "604800000"
    # The Kafka agent tiers every topic that can be; saying so here keeps
    # the Topic Operator from trying to undo it.
    remote.storage.enable: "true"
---
# Source app's snapshot progress, which the connector reports and
# the source controller follows.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: changeport.cdc.notifications.app
  namespace: customer-acme
  labels:
    strimzi.io/cluster: "acme"
    changeport.io/source: app
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  topicName: changeport.cdc.notifications.app
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: delete
    retention.ms: "604800000"
    # The Kafka agent tiers every topic that can be; saying so here keeps
    # the Topic Operator from trying to undo it.
    remote.storage.enable: "true"
---
# Source app's Debezium connector: it streams the changes of the
# source's tables from the customer's database, through its publication and
# its own replication slot, into a topic per table, as Avro.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: app-x1y2z3
  namespace: customer-acme
  labels:
    strimzi.io/cluster: changeport-connect
    changeport.io/source: app
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  state: running
  autoRestart:
    enabled: true
  config:
    database.hostname: "app.abc123.us-east-1.rds.amazonaws.com"
    database.port: 5432
    database.dbname: "app"
    database.user: "changeport_app_x1y2z3"
    database.password: "${directory:/mnt/sources:app}"
    database.sslmode: verify-full
    database.sslrootcert: /mnt/sources/app.ca
    # Changes as the credentials do, which restarts the connector with them.
    changeport.credentials.version: "postgres-password-app-1/0a1b2c3d"
    topic.prefix: app
    plugin.name: pgoutput
    publication.name: changeport_app_x1y2z3
    publication.autocreate.mode: disabled
    slot.name: changeport_app_x1y2z3
    table.include.list: "public\\.orders,Sales\\.Order\\ Lines"
    # Existing rows arrive through read-only incremental snapshots, which
    # the source controller asks for on the signal topic: in chunks, while
    # changes stream, without locks or writes to the customer's database.
    snapshot.mode: no_data
    read.only: true
    incremental.snapshot.chunk.size: 1024
    signal.enabled.channels: kafka
    signal.kafka.topic: changeport.cdc.signals.app
    signal.kafka.groupId: changeport.cdc.signals.app
    signal.kafka.bootstrap.servers: "acme-kafka-bootstrap:9093"
    signal.consumer.security.protocol: SSL
    signal.consumer.ssl.keystore.type: PKCS12
    signal.consumer.ssl.keystore.location: /mnt/connect-user/user.p12
    signal.consumer.ssl.keystore.password: "${directory:/mnt/connect-user:user.password}"
    signal.consumer.ssl.truststore.type: PKCS12
    signal.consumer.ssl.truststore.location: /mnt/cluster-ca/ca.p12
    signal.consumer.ssl.truststore.password: "${directory:/mnt/cluster-ca:ca.password}"
    notification.enabled.channels: sink
    notification.sink.topic.name: changeport.cdc.notifications.app
    # A transactional logical message every minute lets the slot advance
    # while the source's tables are idle; Debezium drops the messages.
    heartbeat.interval.ms: 60000
    heartbeat.action.query: "SELECT pg_logical_emit_message(true, 'changeport-heartbeat', '')"
    message.prefix.exclude.list: changeport-heartbeat
    topic.heartbeat.prefix: changeport.cdc.heartbeat
    tombstones.on.delete: true
    # Avro names allow fewer characters than Postgres's.
    schema.name.adjustment.mode: avro
    field.name.adjustment.mode: avro
    key.converter: io.apicurio.registry.utils.converter.AvroConverter
    key.converter.apicurio.registry.url: http://changeport-registry.customer-acme.svc:8080/apis/registry/v3
    key.converter.apicurio.registry.auto-register: true
    key.converter.apicurio.registry.headers.enabled: false
    value.converter: io.apicurio.registry.utils.converter.AvroConverter
    value.converter.apicurio.registry.url: http://changeport-registry.customer-acme.svc:8080/apis/registry/v3
    value.converter.apicurio.registry.auto-register: true
    value.converter.apicurio.registry.headers.enabled: false
    # One partition per table, keyed by the primary key, with the source's
    # retention.
    topic.creation.default.partitions: 1
    topic.creation.default.replication.factor: 1
    topic.creation.default.cleanup.policy: delete
    topic.creation.default.retention.ms: "3600000"
    topic.creation.default.local.retention.ms: "3600000"
---
# Source billing's snapshot signals: the source controller asks for the
# existing rows of its tables here, and the connector reads them.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: changeport.cdc.signals.billing
  namespace: customer-acme
  labels:
    strimzi.io/cluster: "acme"
    changeport.io/source: billing
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  topicName: changeport.cdc.signals.billing
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: delete
    retention.ms: "604800000"
    # The Kafka agent tiers every topic that can be; saying so here keeps
    # the Topic Operator from trying to undo it.
    remote.storage.enable: "true"
---
# Source billing's snapshot progress, which the connector reports and
# the source controller follows.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: changeport.cdc.notifications.billing
  namespace: customer-acme
  labels:
    strimzi.io/cluster: "acme"
    changeport.io/source: billing
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  topicName: changeport.cdc.notifications.billing
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: delete
    retention.ms: "604800000"
    # The Kafka agent tiers every topic that can be; saying so here keeps
    # the Topic Operator from trying to undo it.
    remote.storage.enable: "true"
---
# The schema registry, Apicurio Registry, which keeps the Avro schemas of the
# sources' topics in the customer's Kafka. Customers reach it through the
# registry gateway; the Connect worker inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changeport-registry
  namespace: customer-acme
  labels:
    app.kubernetes.io/name: changeport-registry
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: changeport-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: changeport-registry
        changeport.io/tenant: "acme"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {strimzi.io/cluster: "acme", strimzi.io/pool-name: dual-role}}
      containers:
        - name: registry
          image: quay.io/apicurio/apicurio-registry:3.3.3
          env:
            - name: APICURIO_STORAGE_KIND
              value: kafkasql
            - name: APICURIO_KAFKASQL_BOOTSTRAP_SERVERS
              value: "acme-kafka-bootstrap:9093"
            - name: APICURIO_KAFKASQL_TOPIC
              value: changeport.registry.journal
            - name: APICURIO_KAFKASQL_SNAPSHOTS_TOPIC
              value: changeport.registry.snapshots
            - name: APICURIO_EVENTS_KAFKA_TOPIC
              value: changeport.registry.events
            - name: APICURIO_KAFKASQL_CONSUMER_GROUP_PREFIX
              value: changeport.registry.
            - name: APICURIO_KAFKASQL_SECURITY_PROTOCOL
              value: SSL
            - name: APICURIO_KAFKASQL_SECURITY_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: APICURIO_KAFKASQL_SECURITY_SSL_KEYSTORE_LOCATION
              value: /mnt/user/user.p12
            - name: APICURIO_KAFKASQL_SECURITY_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef: {name: changeport-registry, key: user.password}
            - name: APICURIO_KAFKASQL_SECURITY_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: APICURIO_KAFKASQL_SECURITY_SSL_TRUSTSTORE_LOCATION
              value: /mnt/cluster-ca/ca.p12
            - name: APICURIO_KAFKASQL_SECURITY_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef: {name: acme-cluster-ca-cert, key: ca.password}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: user
              mountPath: /mnt/user
              readOnly: true
            - name: cluster-ca
              mountPath: /mnt/cluster-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # The certificate of the registry's KafkaUser, from the User Operator.
        - name: user
          secret:
            secretName: changeport-registry
        - name: cluster-ca
          secret:
            secretName: acme-cluster-ca-cert
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: changeport-registry
  namespace: customer-acme
  labels:
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  selector:
    app.kubernetes.io/name: changeport-registry
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The Connect worker reaches only DNS, the brokers, the registry, the other
# workers, the Kubernetes API, which Strimzi's config provider reads its
# certificates from, and databases on the internet; never the cluster's own
# networks or the cloud's metadata service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: changeport-connect-egress
  namespace: customer-acme
  labels:
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  podSelector: {matchLabels: {strimzi.io/cluster: changeport-connect, strimzi.io/kind: KafkaConnect}}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {matchLabels: {strimzi.io/cluster: "acme", strimzi.io/kind: Kafka}}
      ports:
        - {protocol: TCP, port: 9093}
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: changeport-registry}}
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - podSelector: {matchLabels: {strimzi.io/cluster: changeport-connect, strimzi.io/kind: KafkaConnect}}
      ports:
        - {protocol: TCP, port: 8083}
    - to:
        - ipBlock: {cidr: 172.19.0.5/32}
      ports:
        - {protocol: TCP, port: 6443}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/3
    # The databases that stand in for customers' on this platform.
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: source-postgres}}
---
# Only the Connect worker reaches the registry, the source controller, which
# decodes the snapshot notifications with its schemas, and the registry
# gateway; the registry reaches only DNS and the brokers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: changeport-registry
  namespace: customer-acme
  labels:
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: changeport-registry}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {strimzi.io/cluster: changeport-connect, strimzi.io/kind: KafkaConnect}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: changeport}}
          podSelector: {matchLabels: {app.kubernetes.io/name: changeport-provisioner}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: changeport-registry-gateway}}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {matchLabels: {strimzi.io/cluster: "acme", strimzi.io/kind: Kafka}}
      ports:
        - {protocol: TCP, port: 9093}
---
# The registry gateway (cmd/registry-gateway): customers' clients reach their
# schema registry through it from the internet, at registry.acme.kafka.changeport.test, over TLS
# on the cluster's certificate, with their Kafka credentials. It refuses
# changes to the sources' schemas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changeport-registry-gateway
  namespace: customer-acme
  labels:
    app.kubernetes.io/name: changeport-registry-gateway
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: changeport-registry-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: changeport-registry-gateway
        changeport.io/tenant: "acme"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {strimzi.io/cluster: "acme", strimzi.io/pool-name: dual-role}}
      containers:
        - name: gateway
          image: changeport/registry-gateway:local
          args:
            - "-upstream=http://changeport-registry:8080/apis/ccompat/v7"
            - "-username=admin"
            - "-sources=app,billing"
          ports:
            - name: https
              containerPort: 8443
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: kafka-user
              mountPath: /etc/changeport/kafka-user
              readOnly: true
            - name: tls
              mountPath: /etc/changeport/tls
              readOnly: true
      volumes:
        # The customer's Kafka user's password, which the gateway checks.
        - name: kafka-user
          secret:
            secretName: admin
            items: [{key: password, path: password}]
        # The public listener's certificate, whose wildcard name covers the
        # gateway's.
        - name: tls
          secret:
            secretName: external-listener-tls
---
apiVersion: v1
kind: Service
metadata:
  name: changeport-registry-gateway
  namespace: customer-acme
  labels:
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "registry.acme.kafka.changeport.test"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: changeport-registry-gateway
  ports:
    - name: https
      port: 443
      targetPort: https
---
# The gateway takes customers' connections from anywhere, and reaches only
# DNS and the registry.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: changeport-registry-gateway
  namespace: customer-acme
  labels:
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: changeport-registry-gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8443}
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: changeport-registry}}
      ports:
        - {protocol: TCP, port: 8080}
