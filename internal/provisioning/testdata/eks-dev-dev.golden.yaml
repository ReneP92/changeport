apiVersion: v1
kind: Namespace
metadata:
  name: customer-acme
  labels:
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
---
# The customer's own nodes: EKS Auto Mode launches them for this NodePool
# only, labelled and tainted with the tenant so that no other pods run there.
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: customer-acme
  labels:
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  role: changeport-dev-customer-node
  subnetSelectorTerms:
    - tags:
        changeport.io/customer-nodes: "true"
  securityGroupSelectorTerms:
    - tags:
        changeport.io/customer-nodes: "true"
  # Shows each customer's nodes in cost allocation.
  tags:
    changeport.io/tenant: "acme"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: customer-acme
  labels:
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  template:
    metadata:
      labels:
        changeport.io/tenant: "acme"
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: customer-acme
      taints:
        - key: changeport.io/tenant
          value: "acme"
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [arm64]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: eks.amazonaws.com/instance-family
          operator: In
          values: [m7g, m8g]
        - key: eks.amazonaws.com/instance-cpu
          operator: In
          values: ["2"]
      # The longest node lifetime EKS Auto Mode allows. Expiry ignores the
      # disruption budgets; Strimzi Drain Cleaner turns the eviction of a
      # broker into a rolling restart by the Strimzi operator instead.
      expireAfter: 504h
      terminationGracePeriod: 24h
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    budgets:
      # One node at a time.
      - nodes: "1"
      # Drifted nodes, mostly after new Auto Mode AMIs (about weekly), are
      # replaced only between 06:00 and 10:00 UTC, at night in us-east-1.
      - nodes: "0"
        reasons: [Drifted]
        schedule: "0 10 * * *"
        duration: 20h
  limits:
    cpu: "4"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: external-listener
  namespace: customer-acme
  labels:
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  # One wildcard name covers the bootstrap name and every broker's name.
  dnsNames:
    - "*.acme.kafka.dev.changeport.invalid"
  secretName: external-listener-tls
  privateKey:
    algorithm: ECDSA
    size: 256
    # Kafka only loads PEM private keys in PKCS#8.
    encoding: PKCS8
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-staging
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: customer-acme
  labels:
    strimzi.io/cluster: "acme"
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  replicas: 1
  roles:
    - controller
    - broker
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      memory: "1Gi"
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: "5Gi"
        class: "gp3"
        deleteClaim: false
        kraftMetadata: shared
  template:
    pod:
      affinity:
        nodeAffinity: {requiredDuringSchedulingIgnoredDuringExecution: {nodeSelectorTerms: [{matchExpressions: [{key: changeport.io/tenant, operator: In, values: ["acme"]}]}]}}
        # One broker per node.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {strimzi.io/cluster: "acme", strimzi.io/pool-name: dual-role}}
      tolerations: [{key: changeport.io/tenant, operator: Equal, value: "acme", effect: NoSchedule}]
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: "acme"
  namespace: customer-acme
  labels:
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    listeners:
      # Platform clients inside the cluster, such as the Kafka agent.
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
      # Customers, over the internet.
      - name: external
        port: 9094
        type: loadbalancer
        tls: true
        authentication:
          type: scram-sha-512
        configuration:
          class: eks.amazonaws.com/nlb
          brokerCertChainAndKey:
            secretName: external-listener-tls
            certificate: tls.crt
            key: tls.key
          bootstrap:
            annotations:
              external-dns.alpha.kubernetes.io/hostname: "bootstrap.acme.kafka.dev.changeport.invalid"
              service.beta.kubernetes.io/aws-load-balancer-listener-attributes.TCP-9094: "tcp.idle_timeout.seconds=900"
              service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
              service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
          advertisedHostTemplate: b{nodeId}.acme.kafka.dev.changeport.invalid
          perBrokerAnnotationsTemplate:
            external-dns.alpha.kubernetes.io/hostname: "b{nodeId}.acme.kafka.dev.changeport.invalid"
            service.beta.kubernetes.io/aws-load-balancer-listener-attributes.TCP-9094: "tcp.idle_timeout.seconds=900"
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
            service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    authorization:
      type: simple
    config:
      auto.create.topics.enable: false
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
  entityOperator:
    template:
      pod:
        affinity:
          nodeAffinity: {requiredDuringSchedulingIgnoredDuringExecution: {nodeSelectorTerms: [{matchExpressions: [{key: changeport.io/tenant, operator: In, values: ["acme"]}]}]}}
        tolerations: [{key: changeport.io/tenant, operator: Equal, value: "acme", effect: NoSchedule}]
    topicOperator: {}
    userOperator: {}
---
# The customer's user. It manages topics, consumer groups and transactions,
# but cannot change the cluster's configuration, which the platform owns.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: admin
  namespace: customer-acme
  labels:
    strimzi.io/cluster: "acme"
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations: [All]
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations: [All]
      - resource:
          type: transactionalId
          name: "*"
          patternType: literal
        operations: [All]
      - resource:
          type: cluster
        operations: [Describe, DescribeConfigs, IdempotentWrite]
---
# The Kafka agent's user on the internal listener: it reads the cluster and
# keeps topic settings such as tiered storage in place.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: changeport-agent
  namespace: customer-acme
  labels:
    strimzi.io/cluster: "acme"
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations: [Describe, DescribeConfigs, AlterConfigs]
      - resource:
          type: cluster
        operations: [Describe, DescribeConfigs]
