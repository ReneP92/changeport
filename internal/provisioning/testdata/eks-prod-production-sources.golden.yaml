---
# The schema registry, Apicurio Registry, which keeps the Avro schemas of the
# sources' topics in the customer's Kafka. Customers reach it through the
# registry gateway; the Connect worker inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changeport-registry
  namespace: customer-acme
  labels:
    app.kubernetes.io/name: changeport-registry
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: changeport-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: changeport-registry
        changeport.io/tenant: "acme"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity: {requiredDuringSchedulingIgnoredDuringExecution: {nodeSelectorTerms: [{matchExpressions: [{key: changeport.io/tenant, operator: In, values: ["acme"]}]}]}}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {strimzi.io/cluster: "acme", strimzi.io/pool-name: dual-role}}
      tolerations: [{key: changeport.io/tenant, operator: Equal, value: "acme", effect: NoSchedule}]
      containers:
        - name: registry
          image: quay.io/apicurio/apicurio-registry:3.3.3@sha256:c9cae4c90ce46538abf673c68eb591345f23bcc6c2aa6bfd47189adcf609d8f1
          env:
            - name: APICURIO_STORAGE_KIND
              value: kafkasql
            - name: APICURIO_KAFKASQL_BOOTSTRAP_SERVERS
              value: "acme-kafka-bootstrap:9093"
            - name: APICURIO_KAFKASQL_TOPIC
              value: changeport.registry.journal
            - name: APICURIO_KAFKASQL_SNAPSHOTS_TOPIC
              value: changeport.registry.snapshots
            - name: APICURIO_EVENTS_KAFKA_TOPIC
              value: changeport.registry.events
            - name: APICURIO_KAFKASQL_CONSUMER_GROUP_PREFIX
              value: changeport.registry.
            - name: APICURIO_KAFKASQL_SECURITY_PROTOCOL
              value: SSL
            - name: APICURIO_KAFKASQL_SECURITY_SSL_KEYSTORE_TYPE
              value: PKCS12
            - name: APICURIO_KAFKASQL_SECURITY_SSL_KEYSTORE_LOCATION
              value: /mnt/user/user.p12
            - name: APICURIO_KAFKASQL_SECURITY_SSL_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef: {name: changeport-registry, key: user.password}
            - name: APICURIO_KAFKASQL_SECURITY_SSL_TRUSTSTORE_TYPE
              value: PKCS12
            - name: APICURIO_KAFKASQL_SECURITY_SSL_TRUSTSTORE_LOCATION
              value: /mnt/cluster-ca/ca.p12
            - name: APICURIO_KAFKASQL_SECURITY_SSL_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef: {name: acme-cluster-ca-cert, key: ca.password}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: user
              mountPath: /mnt/user
              readOnly: true
            - name: cluster-ca
              mountPath: /mnt/cluster-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # The certificate of the registry's KafkaUser, from the User Operator.
        - name: user
          secret:
            secretName: changeport-registry
        - name: cluster-ca
          secret:
            secretName: acme-cluster-ca-cert
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: changeport-registry
  namespace: customer-acme
  labels:
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  selector:
    app.kubernetes.io/name: changeport-registry
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The Connect worker reaches only DNS, the brokers, the registry, the other
# workers, the Kubernetes API, which Strimzi's config provider reads its
# certificates from, and databases on the internet; never the cluster's own
# networks or the cloud's metadata service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: changeport-connect-egress
  namespace: customer-acme
  labels:
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  podSelector: {matchLabels: {strimzi.io/cluster: changeport-connect, strimzi.io/kind: KafkaConnect}}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {matchLabels: {strimzi.io/cluster: "acme", strimzi.io/kind: Kafka}}
      ports:
        - {protocol: TCP, port: 9093}
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: changeport-registry}}
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - podSelector: {matchLabels: {strimzi.io/cluster: changeport-connect, strimzi.io/kind: KafkaConnect}}
      ports:
        - {protocol: TCP, port: 8083}
    - to:
        - ipBlock: {cidr: 10.0.31.17/32}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: 10.0.88.204/32}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/3
---
# Only the Connect worker reaches the registry, the source controller, which
# decodes the snapshot notifications with its schemas, and the registry
# gateway; the registry reaches only DNS and the brokers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: changeport-registry
  namespace: customer-acme
  labels:
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: changeport-registry}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {strimzi.io/cluster: changeport-connect, strimzi.io/kind: KafkaConnect}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: changeport}}
          podSelector: {matchLabels: {app.kubernetes.io/name: changeport-provisioner}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: changeport-registry-gateway}}
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {matchLabels: {strimzi.io/cluster: "acme", strimzi.io/kind: Kafka}}
      ports:
        - {protocol: TCP, port: 9093}
---
# The registry gateway (cmd/registry-gateway): customers' clients reach their
# schema registry through it from the internet, at registry.acme.kafka.changeport.invalid, over TLS
# on the cluster's certificate, with their Kafka credentials. It refuses
# changes to the sources' schemas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changeport-registry-gateway
  namespace: customer-acme
  labels:
    app.kubernetes.io/name: changeport-registry-gateway
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: changeport-registry-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: changeport-registry-gateway
        changeport.io/tenant: "acme"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity: {requiredDuringSchedulingIgnoredDuringExecution: {nodeSelectorTerms: [{matchExpressions: [{key: changeport.io/tenant, operator: In, values: ["acme"]}]}]}}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {strimzi.io/cluster: "acme", strimzi.io/pool-name: dual-role}}
      tolerations: [{key: changeport.io/tenant, operator: Equal, value: "acme", effect: NoSchedule}]
      containers:
        - name: gateway
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/changeport/registry-gateway@sha256:fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
          args:
            - "-upstream=http://changeport-registry:8080/apis/ccompat/v7"
            - "-username=admin"
            - "-sources=app,billing"
          ports:
            - name: https
              containerPort: 8443
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: kafka-user
              mountPath: /etc/changeport/kafka-user
              readOnly: true
            - name: tls
              mountPath: /etc/changeport/tls
              readOnly: true
      volumes:
        # The customer's Kafka user's password, which the gateway checks.
        - name: kafka-user
          secret:
            secretName: admin
            items: [{key: password, path: password}]
        # The public listener's certificate, whose wildcard name covers the
        # gateway's.
        - name: tls
          secret:
            secretName: external-listener-tls
---
apiVersion: v1
kind: Service
metadata:
  name: changeport-registry-gateway
  namespace: customer-acme
  labels:
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "registry.acme.kafka.changeport.invalid"
    service.beta.kubernetes.io/aws-load-balancer-listener-attributes.TCP-9094: "tcp.idle_timeout.seconds=900"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: "preserve_client_ip.enabled=true"
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  selector:
    app.kubernetes.io/name: changeport-registry-gateway
  ports:
    - name: https
      port: 443
      targetPort: https
---
# The gateway takes customers' connections from anywhere, and reaches only
# DNS and the registry.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: changeport-registry-gateway
  namespace: customer-acme
  labels:
    changeport.io/part: cdc
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: "acme"
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: changeport-registry-gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8443}
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: changeport-registry}}
      ports:
        - {protocol: TCP, port: 8080}
