apiVersion: v1
kind: Namespace
metadata:
  name: customer-acme
  labels:
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: acme
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: customer-acme
  labels:
    strimzi.io/cluster: acme
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: acme
spec:
  replicas: 3
  roles:
    - controller
    - broker
  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      memory: "4Gi"
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: "100Gi"
        class: "standard"
        deleteClaim: false
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: acme
  namespace: customer-acme
  labels:
    app.kubernetes.io/managed-by: changeport-provisioner
    changeport.io/tenant: acme
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    rack:
      topologyKey: topology.kubernetes.io/zone
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
