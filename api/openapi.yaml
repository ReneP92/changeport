openapi: 3.0.3
info:
  title: Changeport console API
  version: 0.1.0
  description: |
    The API behind the Changeport console. Every route except /api/config
    needs a Clerk session token as a Bearer token.

    Customer routes act on the customer of the signed-in user's active Clerk
    organization, never on one named in the request. Operator routes need the
    active organization to be the Changeport staff organization.

    Without its Clerk configuration the console fails closed: every route
    answers 503.
servers:
  - url: /
security:
  - clerk: []
paths:
  /api/config:
    get:
      operationId: getConfig
      summary: What the web app needs before anyone signs in
      security: []
      responses:
        "200":
          description: The console's public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/me:
    get:
      operationId: getMe
      summary: Who is signed in, and what they may see
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer:
    get:
      operationId: getCustomer
      summary: The customer of the active organization and its Kafka cluster
      responses:
        "200":
          description: The customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/connection:
    get:
      operationId: getConnection
      summary: How the customer's clients connect, without the password
      responses:
        "200":
          description: The connection details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/client-properties:
    get:
      operationId: getClientProperties
      summary: A client.properties with the admin user's credentials, for organization admins
      responses:
        "200":
          description: A Java client.properties
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotReady"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/health:
    get:
      operationId: getHealth
      summary: The brokers and the partitions' health
      responses:
        "200":
          description: The cluster's health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/topic-policy:
    get:
      operationId: getTopicPolicy
      summary: The guardrails on the customer's topics, for the create dialog
      responses:
        "200":
          description: The topic policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/topics/{topic}:
    delete:
      operationId: deleteTopic
      summary: Deletes a topic and its messages, for organization admins
      parameters:
        - $ref: "#/components/parameters/TopicName"
      responses:
        "204":
          description: The topic is deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotReady"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/topics/{topic}/consumer-groups:
    get:
      operationId: listTopicConsumerGroups
      summary: The consumer groups with committed offsets on a topic
      parameters:
        - $ref: "#/components/parameters/TopicName"
      responses:
        "200":
          description: The groups, by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerGroupList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotReady"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/topics:
    post:
      operationId: createTopic
      summary: Creates a topic within the guardrails, for organization admins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTopic"
      responses:
        "201":
          description: The topic is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/NotConfigured"
    get:
      operationId: listTopics
      summary: The customer's topics, with their settings, size and throughput
      responses:
        "200":
          description: The topics, by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotReady"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/throughput:
    get:
      operationId: getThroughput
      summary: Bytes in and out per second over the whole cluster
      parameters:
        - name: range
          in: query
          required: false
          description: How far back to look
          schema:
            type: string
            enum: [1h, 6h, 24h, 7d]
            default: 1h
      responses:
        "200":
          description: The throughput
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Throughput"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/operator/customers:
    get:
      operationId: listCustomers
      summary: Every customer, for operators
      responses:
        "200":
          description: The customers, by ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/operator/customers/{customerID}:
    get:
      operationId: getOperatorCustomer
      summary: One customer, for operators
      parameters:
        - $ref: "#/components/parameters/CustomerID"
      responses:
        "200":
          description: The customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
components:
  securitySchemes:
    clerk:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Clerk session token for the console's origin.
  parameters:
    TopicName:
      name: topic
      in: path
      required: true
      description: The topic's name
      schema:
        type: string
        pattern: "^[a-zA-Z0-9._-]+$"
        maxLength: 249
    CustomerID:
      name: customerID
      in: path
      required: true
      description: The customer ID, such as acme
      schema:
        type: string
        pattern: "^[a-z]([-a-z0-9]*[a-z0-9])?$"
        maxLength: 30
  responses:
    Unauthorized:
      description: No valid session token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The signed-in user may not do this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: There is no such customer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with what exists, or the cluster is not ready for it
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotReady:
      description: The cluster is not ready for this yet
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request is malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotConfigured:
      description: The console has no Clerk configuration, so it refuses everything
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: An error, after RFC 9457
      required: [status, title]
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        field:
          type: string
          description: The request field the problem is about, if one
    Config:
      type: object
      required: [clerkPublishableKey]
      properties:
        clerkPublishableKey:
          type: string
          description: The Clerk publishable key the web app signs in with
    Me:
      type: object
      required: [userID, access]
      properties:
        userID:
          type: string
        organizationID:
          type: string
          description: The active Clerk organization, if any
        access:
          type: string
          enum: [none, customer, operator]
          description: |
            What the user may see: their organization's customer, every
            customer as an operator, or nothing until they choose an
            organization that is a customer.
        admin:
          type: boolean
          description: Whether the user is an admin of the active organization
        customerID:
          type: string
          description: The customer of the active organization, if any
    Connection:
      type: object
      required: [username, securityProtocol, saslMechanism]
      properties:
        bootstrapAddress:
          type: string
          description: Where clients bootstrap from, once the cluster has it
        username:
          type: string
        securityProtocol:
          type: string
          enum: [SASL_SSL]
        saslMechanism:
          type: string
          enum: [SCRAM-SHA-512]
        caCertificate:
          type: string
          description: |
            The PEM certificate of the CA that issued the listener's
            certificate, when clients do not trust it by default
    Health:
      type: object
      required: [brokers]
      description: |
        The brokers, and the partitions' health from the brokers' metrics,
        which are absent until the metrics store has them
      properties:
        brokers:
          type: array
          items:
            $ref: "#/components/schemas/Broker"
        underReplicatedPartitions:
          type: integer
        underMinIsrPartitions:
          type: integer
        offlinePartitions:
          type: integer
        activeControllers:
          type: integer
        activeBrokers:
          type: integer
        fencedBrokers:
          type: integer
    Broker:
      type: object
      required: [name, ready, restarts]
      properties:
        name:
          type: string
        ready:
          type: boolean
        zone:
          type: string
        restarts:
          type: integer
    TopicList:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
    Topic:
      type: object
      required: [name, partitions, replicationFactor, tiered, cleanupPolicy]
      properties:
        name:
          type: string
        partitions:
          type: integer
        replicationFactor:
          type: integer
        tiered:
          type: boolean
          description: Whether the topic offloads its history to tiered storage
        cleanupPolicy:
          type: string
        retentionMs:
          type: integer
          format: int64
          description: How long the topic keeps messages; absent for no limit
        localBytes:
          type: number
          description: Bytes on the brokers' disks, once, not counting replicas
        remoteBytes:
          type: number
          description: Bytes in tiered storage
        bytesInPerSecond:
          type: number
        bytesOutPerSecond:
          type: number
    TopicPolicy:
      type: object
      required: [maxNameLength, reservedPrefixes, partitions, replicationFactor, retentionPresets, defaultRetentionMs, cleanupPolicies]
      properties:
        maxNameLength:
          type: integer
        reservedPrefixes:
          type: array
          items:
            type: string
        partitions:
          $ref: "#/components/schemas/PartitionRange"
        replicationFactor:
          type: integer
          description: Fixed by the cluster's profile
        retentionPresets:
          type: array
          items:
            $ref: "#/components/schemas/RetentionPreset"
        defaultRetentionMs:
          type: integer
          format: int64
        cleanupPolicies:
          type: array
          items:
            $ref: "#/components/schemas/CleanupPolicyOption"
    PartitionRange:
      type: object
      required: [min, max, default]
      properties:
        min:
          type: integer
        max:
          type: integer
        default:
          type: integer
    RetentionPreset:
      type: object
      required: [label, ms]
      properties:
        label:
          type: string
        ms:
          type: integer
          format: int64
    CleanupPolicyOption:
      type: object
      required: [name, tiered]
      properties:
        name:
          type: string
          enum: [delete, compact]
        tiered:
          type: boolean
          description: Whether topics of this policy offload history to tiered storage
    NewTopic:
      type: object
      required: [name, partitions, retentionMs, cleanupPolicy]
      properties:
        name:
          type: string
        partitions:
          type: integer
        retentionMs:
          type: integer
          format: int64
        cleanupPolicy:
          type: string
          enum: [delete, compact]
    ConsumerGroupList:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            type: string
    Throughput:
      type: object
      required: [range, stepSeconds, bytesIn, bytesOut]
      properties:
        range:
          type: string
        stepSeconds:
          type: integer
        bytesIn:
          type: array
          items:
            $ref: "#/components/schemas/Point"
        bytesOut:
          type: array
          items:
            $ref: "#/components/schemas/Point"
    Point:
      type: object
      required: [time, value]
      properties:
        time:
          type: string
          format: date-time
        value:
          type: number
    CustomerList:
      type: object
      required: [customers]
      properties:
        customers:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
    Customer:
      type: object
      required: [id, displayName, profile, ready, status, conditions, deletionProtection, createdAt]
      properties:
        id:
          type: string
        displayName:
          type: string
        profile:
          type: string
          enum: [dev, dev-ha, production]
        bootstrapAddress:
          type: string
          description: Where the customer's clients connect, once known
        ready:
          type: boolean
          description: Whether clients can connect
        status:
          $ref: "#/components/schemas/Status"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
        deletionProtection:
          type: boolean
        deleting:
          type: boolean
          description: Whether the customer is being deleted
        createdAt:
          type: string
          format: date-time
    Status:
      type: object
      description: The Ready condition, which says what the cluster waits for
      required: [reason, message]
      properties:
        reason:
          type: string
        message:
          type: string
    Condition:
      type: object
      required: [type, ready, reason, message]
      properties:
        type:
          type: string
          enum: [CertificateIssued, KafkaReady, UsersReady, AgentAvailable, Ready]
        ready:
          type: boolean
        reason:
          type: string
        message:
          type: string
        since:
          type: string
          format: date-time
