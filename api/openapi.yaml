openapi: 3.0.3
info:
  title: Changeport console API
  version: 0.1.0
  description: |
    The API behind the Changeport console. Every route except /api/config
    needs a Clerk session token as a Bearer token.

    Customer routes act on the customer of the signed-in user's active Clerk
    organization, never on one named in the request. Operator routes need the
    active organization to be the Changeport staff organization.

    Without its Clerk configuration the console fails closed: every route
    answers 503.
servers:
  - url: /
security:
  - clerk: []
paths:
  /api/config:
    get:
      operationId: getConfig
      summary: What the web app needs before anyone signs in
      security: []
      responses:
        "200":
          description: The console's public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/me:
    get:
      operationId: getMe
      summary: Who is signed in, and what they may see
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer:
    get:
      operationId: getCustomer
      summary: The customer of the active organization and its Kafka cluster
      responses:
        "200":
          description: The customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/connection:
    get:
      operationId: getConnection
      summary: How the customer's clients connect, without the password
      responses:
        "200":
          description: The connection details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/client-properties:
    get:
      operationId: getClientProperties
      summary: A client.properties with the admin user's credentials, for organization admins
      responses:
        "200":
          description: A Java client.properties
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotReady"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/health:
    get:
      operationId: getHealth
      summary: The brokers and the partitions' health
      responses:
        "200":
          description: The cluster's health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/topic-policy:
    get:
      operationId: getTopicPolicy
      summary: The guardrails on the customer's topics, for the create dialog
      responses:
        "200":
          description: The topic policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/topics/{topic}:
    delete:
      operationId: deleteTopic
      summary: Deletes a topic and its messages, for organization admins
      parameters:
        - $ref: "#/components/parameters/TopicName"
      responses:
        "204":
          description: The topic is deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotReady"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/topics/{topic}/consumer-groups:
    get:
      operationId: listTopicConsumerGroups
      summary: The consumer groups with committed offsets on a topic
      parameters:
        - $ref: "#/components/parameters/TopicName"
      responses:
        "200":
          description: The groups, by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerGroupList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotReady"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/topics:
    post:
      operationId: createTopic
      summary: Creates a topic within the guardrails, for organization admins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewTopic"
      responses:
        "201":
          description: The topic is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/NotConfigured"
    get:
      operationId: listTopics
      summary: The customer's topics, with their settings, size and throughput
      responses:
        "200":
          description: The topics, by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotReady"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/source-options:
    get:
      operationId: getSourceOptions
      summary: What a new Postgres CDC source may be, and where Changeport connects from
      responses:
        "200":
          description: The options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/sources:
    get:
      operationId: listSources
      summary: The customer's Postgres CDC sources
      responses:
        "200":
          description: The sources, by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
    post:
      operationId: createSource
      summary: Creates a source once its database passes the checks, for organization admins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSource"
      responses:
        "201":
          description: The source is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/sources/setup-sql:
    post:
      operationId: getSetupSQL
      summary: The SQL and steps that set a database up for a new source, for organization admins
      description: |
        The role step chooses the source's ID and, unless the customer's
        provider makes the password, a password, which only this answer
        holds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupSQLRequest"
      responses:
        "200":
          description: What the customer runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSQL"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/sources/checks:
    post:
      operationId: checkSource
      summary: Checks a database for a source, as Changeport will connect to it, for organization admins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceCheckRequest"
      responses:
        "200":
          description: The checks' results, in order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/sources/tables:
    post:
      operationId: listSourceTables
      summary: The tables of a database a source may sync, for organization admins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceCheckRequest"
      responses:
        "200":
          description: The tables, with whether each can be synced and its topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceTableList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/sources/{source}:
    parameters:
      - $ref: "#/components/parameters/SourceName"
    get:
      operationId: getSource
      summary: A source, with each table's progress and its slot's health
      responses:
        "200":
          description: The source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
    patch:
      operationId: changeSource
      summary: Changes a source's tables, retention or state, for organization admins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceChange"
      responses:
        "200":
          description: The source as changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/NotConfigured"
    delete:
      operationId: deleteSource
      summary: Deletes a source, which drops its slot; for organization admins
      parameters:
        - name: confirm
          in: query
          required: true
          description: The source's name, typed again
          schema:
            type: string
      responses:
        "204":
          description: The source is being deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/sources/{source}/sql:
    parameters:
      - $ref: "#/components/parameters/SourceName"
    post:
      operationId: getSourceSQL
      summary: The SQL for a change to a source's database, for organization admins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSQLRequest"
      responses:
        "200":
          description: What the customer runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSQL"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/sources/{source}/password:
    parameters:
      - $ref: "#/components/parameters/SourceName"
    put:
      operationId: setSourcePassword
      summary: Gives a source the role's new password, once it logs in; for organization admins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourcePassword"
      responses:
        "204":
          description: The source uses the new password
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/sources/{source}/slot-dropped:
    parameters:
      - $ref: "#/components/parameters/SourceName"
    post:
      operationId: confirmSlotDropped
      summary: Confirms that the customer dropped a deleted source's slot themselves; for organization admins
      responses:
        "204":
          description: The source goes
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/throughput:
    get:
      operationId: getThroughput
      summary: Bytes in and out per second over the whole cluster
      parameters:
        - name: range
          in: query
          required: false
          description: How far back to look
          schema:
            type: string
            enum: [1h, 6h, 24h, 7d]
            default: 1h
      responses:
        "200":
          description: The throughput
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Throughput"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/customer/consumer-groups:
    get:
      operationId: listConsumerGroups
      summary: The consumer groups' lag per topic, with the last hour of it
      responses:
        "200":
          description: The consumer groups, most behind first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerGroupLagList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/operator/customers:
    get:
      operationId: listCustomers
      summary: Every customer, for operators
      responses:
        "200":
          description: The customers, by ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotConfigured"
    post:
      operationId: provisionCustomer
      summary: Provision a customer, for operators
      description: >-
        Creates a Clerk organization for the customer, invites its first
        admin if asked, and creates the customer with a new opaque ID, such as
        c-7f3k2q. The provisioning controller then creates its cluster, which
        the customer's conditions follow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewCustomer"
      responses:
        "201":
          description: The customer, whose cluster is being created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/NotConfigured"
  /api/operator/customers/{customerID}:
    get:
      operationId: getOperatorCustomer
      summary: One customer, for operators
      parameters:
        - $ref: "#/components/parameters/CustomerID"
      responses:
        "200":
          description: The customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
    delete:
      operationId: deprovisionCustomer
      summary: Deprovision a customer, for operators
      description: >-
        Deletes the customer, whose cluster the provisioning controller then
        deletes. A customer under deletion protection is refused. The
        customer's Clerk organization is kept, no longer linked to a cluster.
      parameters:
        - $ref: "#/components/parameters/CustomerID"
      responses:
        "204":
          description: The customer is being deprovisioned
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/NotConfigured"
components:
  securitySchemes:
    clerk:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Clerk session token for the console's origin.
  parameters:
    TopicName:
      name: topic
      in: path
      required: true
      description: The topic's name
      schema:
        type: string
        pattern: "^[a-zA-Z0-9._-]+$"
        maxLength: 249
    SourceName:
      name: source
      in: path
      required: true
      description: The source's name, which prefixes its topics
      schema:
        type: string
        pattern: "^[a-z]([-a-z0-9]*[a-z0-9])?$"
        maxLength: 40
    CustomerID:
      name: customerID
      in: path
      required: true
      description: The customer ID, such as acme
      schema:
        type: string
        pattern: "^[a-z]([-a-z0-9]*[a-z0-9])?$"
        maxLength: 30
  responses:
    Unauthorized:
      description: No valid session token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The signed-in user may not do this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: There is no such customer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with what exists, or the cluster is not ready for it
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotReady:
      description: The cluster is not ready for this yet
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request is malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotConfigured:
      description: The console has no Clerk configuration, so it refuses everything
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: An error, after RFC 9457
      required: [status, title]
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        field:
          type: string
          description: The request field the problem is about, if one
    Config:
      type: object
      required: [clerkPublishableKey]
      properties:
        clerkPublishableKey:
          type: string
          description: The Clerk publishable key the web app signs in with
    Me:
      type: object
      required: [userID, access]
      properties:
        userID:
          type: string
        organizationID:
          type: string
          description: The active Clerk organization, if any
        access:
          type: string
          enum: [none, customer, operator]
          description: |
            What the user may see: their organization's customer, every
            customer as an operator, or nothing until they choose an
            organization that is a customer.
        admin:
          type: boolean
          description: Whether the user is an admin of the active organization
        customerID:
          type: string
          description: The customer of the active organization, if any
    Connection:
      type: object
      required: [username, securityProtocol, saslMechanism]
      properties:
        bootstrapAddress:
          type: string
          description: Where clients bootstrap from, once the cluster has it
        username:
          type: string
        securityProtocol:
          type: string
          enum: [SASL_SSL]
        saslMechanism:
          type: string
          enum: [SCRAM-SHA-512]
        caCertificate:
          type: string
          description: |
            The PEM certificate of the CA that issued the listener's
            certificate, when clients do not trust it by default
    Health:
      type: object
      required: [brokers]
      description: |
        The brokers, and the partitions' health from the brokers' metrics,
        which are absent until the metrics store has them
      properties:
        brokers:
          type: array
          items:
            $ref: "#/components/schemas/Broker"
        underReplicatedPartitions:
          type: integer
        underMinIsrPartitions:
          type: integer
        offlinePartitions:
          type: integer
        activeControllers:
          type: integer
        activeBrokers:
          type: integer
        fencedBrokers:
          type: integer
    Broker:
      type: object
      required: [name, ready, restarts]
      properties:
        name:
          type: string
        ready:
          type: boolean
        zone:
          type: string
        restarts:
          type: integer
    TopicList:
      type: object
      required: [topics]
      properties:
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
    Topic:
      type: object
      required: [name, partitions, replicationFactor, tiered, cleanupPolicy]
      properties:
        name:
          type: string
        partitions:
          type: integer
        replicationFactor:
          type: integer
        tiered:
          type: boolean
          description: Whether the topic offloads its history to tiered storage
        cleanupPolicy:
          type: string
        retentionMs:
          type: integer
          format: int64
          description: How long the topic keeps messages; absent for no limit
        localBytes:
          type: number
          description: Bytes on the brokers' disks, once, not counting replicas
        remoteBytes:
          type: number
          description: Bytes in tiered storage
        bytesInPerSecond:
          type: number
        bytesOutPerSecond:
          type: number
        source:
          type: string
          description: The Postgres source that writes the topic, which keeps it from being deleted
    TopicPolicy:
      type: object
      required: [maxNameLength, reservedPrefixes, partitions, replicationFactor, retentionPresets, defaultRetentionMs, cleanupPolicies]
      properties:
        maxNameLength:
          type: integer
        reservedPrefixes:
          type: array
          items:
            type: string
        partitions:
          $ref: "#/components/schemas/PartitionRange"
        replicationFactor:
          type: integer
          description: Fixed by the cluster's profile
        retentionPresets:
          type: array
          items:
            $ref: "#/components/schemas/RetentionPreset"
        defaultRetentionMs:
          type: integer
          format: int64
        cleanupPolicies:
          type: array
          items:
            $ref: "#/components/schemas/CleanupPolicyOption"
    PartitionRange:
      type: object
      required: [min, max, default]
      properties:
        min:
          type: integer
        max:
          type: integer
        default:
          type: integer
    TableRef:
      type: object
      required: [schema, name]
      properties:
        schema:
          type: string
          minLength: 1
          maxLength: 63
        name:
          type: string
          minLength: 1
          maxLength: 63
    Provider:
      type: string
      enum: [generic, rds, cloudsql, azure, supabase, neon]
      description: Where the database runs
    ProviderOption:
      type: object
      required: [id, title, passwordFromCustomer]
      properties:
        id:
          $ref: "#/components/schemas/Provider"
        title:
          type: string
        passwordFromCustomer:
          type: boolean
          description: Whether the customer brings the role's password, made in the provider's own console
    SourceOptions:
      type: object
      required: [providers, egressAddresses, maxTables, maxNameLength, retentionPresets, defaultRetentionMs]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderOption"
        egressAddresses:
          type: array
          description: The addresses Changeport connects to databases from, which they allowlist
          items:
            type: string
        maxTables:
          type: integer
        maxNameLength:
          type: integer
        retentionPresets:
          type: array
          items:
            $ref: "#/components/schemas/RetentionPreset"
        defaultRetentionMs:
          type: integer
          format: int64
        registryURL:
          type: string
          description: Where clients reach the schema registry, once the customer has a source
    SetupSQLRequest:
      type: object
      required: [step, name, provider]
      properties:
        step:
          type: string
          enum: [role, tables]
        name:
          type: string
        provider:
          $ref: "#/components/schemas/Provider"
        id:
          type: string
          description: The source's ID from the role step, for the tables step
        tables:
          type: array
          items:
            $ref: "#/components/schemas/TableRef"
    SourceSQLRequest:
      type: object
      required: [step]
      properties:
        step:
          type: string
          enum: [add, remove, password, cleanup, dropSlot]
        tables:
          type: array
          description: The tables to add or remove
          items:
            $ref: "#/components/schemas/TableRef"
    SourceSQL:
      type: object
      required: [id, role, steps, sql]
      properties:
        id:
          type: string
        role:
          type: string
          description: The role Changeport logs in as
        password:
          type: string
          description: A new password for the role, which only this answer holds
        steps:
          type: array
          description: What to do outside SQL, before the SQL
          items:
            type: string
        sql:
          type: string
          description: The SQL to run in the source's database; empty when there is none
    SourceConnection:
      type: object
      required: [host, port, database, tlsMode, password]
      properties:
        host:
          type: string
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        database:
          type: string
          maxLength: 63
        tlsMode:
          type: string
          enum: [verify-full, verify-ca]
        ca:
          type: string
          maxLength: 65536
          description: The PEM certificates of the database's CA; without them, verify-full trusts the public authorities
        password:
          type: string
          maxLength: 1024
    SourceCheckRequest:
      type: object
      required: [name, id, provider, connection]
      properties:
        name:
          type: string
        id:
          type: string
        provider:
          $ref: "#/components/schemas/Provider"
        connection:
          $ref: "#/components/schemas/SourceConnection"
        tables:
          type: array
          description: The chosen tables; without them, the checks of tables and the publication do not run
          items:
            $ref: "#/components/schemas/TableRef"
    CheckResult:
      type: object
      required: [check, status, message]
      properties:
        check:
          type: string
        status:
          type: string
          enum: [pass, warn, fail, skipped]
        message:
          type: string
    CheckReport:
      type: object
      required: [ok, results]
      properties:
        ok:
          type: boolean
          description: Whether every check passed, warnings included
        results:
          type: array
          items:
            $ref: "#/components/schemas/CheckResult"
    SourceTable:
      type: object
      required: [schema, name, partitioned, estimatedRows, readable, keyed, topic]
      properties:
        schema:
          type: string
        name:
          type: string
        partitioned:
          type: boolean
        estimatedRows:
          type: integer
          format: int64
          description: Postgres's estimate, or -1 before the table was first analyzed
        readable:
          type: boolean
        keyed:
          type: boolean
          description: Whether the table can be synced
        reason:
          type: string
          description: Why the table cannot be synced
        topic:
          type: string
          description: The table's topic, if it is synced
        topicProblem:
          type: string
          description: Why the table's topic cannot be created, such as a name that collides
    SourceTableList:
      type: object
      required: [tables]
      properties:
        tables:
          type: array
          items:
            $ref: "#/components/schemas/SourceTable"
    NewSource:
      type: object
      required: [name, id, provider, connection, tables, retentionMs]
      properties:
        name:
          type: string
        id:
          type: string
        provider:
          $ref: "#/components/schemas/Provider"
        connection:
          $ref: "#/components/schemas/SourceConnection"
        tables:
          type: array
          items:
            $ref: "#/components/schemas/TableRef"
        retentionMs:
          type: integer
          format: int64
    SourceChange:
      type: object
      properties:
        tables:
          type: array
          items:
            $ref: "#/components/schemas/TableRef"
        retentionMs:
          type: integer
          format: int64
        state:
          type: string
          enum: [Running, Stopped]
    SourcePassword:
      type: object
      required: [password]
      properties:
        password:
          type: string
          maxLength: 1024
    SourceTableStatus:
      type: object
      required: [schema, name, topic, snapshot]
      properties:
        schema:
          type: string
        name:
          type: string
        topic:
          type: string
        snapshot:
          type: string
          enum: [Pending, Running, Done, Failed]
        rowsCopied:
          type: integer
          format: int64
        rowsEstimated:
          type: integer
          format: int64
        message:
          type: string
    SlotHealth:
      type: object
      required: [name, active, retainedWALBytes, checkedAt]
      properties:
        name:
          type: string
        active:
          type: boolean
        retainedWALBytes:
          type: integer
          format: int64
        walStatus:
          type: string
        safeWALSizeBytes:
          type: integer
          format: int64
        checkedAt:
          type: string
          format: date-time
    Source:
      type: object
      required: [name, id, provider, role, host, port, database, tlsMode, tables, retentionMs, state, phase, ready, reason, message, createdAt]
      properties:
        name:
          type: string
        id:
          type: string
        provider:
          $ref: "#/components/schemas/Provider"
        role:
          type: string
        host:
          type: string
        port:
          type: integer
        database:
          type: string
        tlsMode:
          type: string
        tables:
          type: array
          items:
            $ref: "#/components/schemas/SourceTableStatus"
        retentionMs:
          type: integer
          format: int64
        state:
          type: string
          enum: [Running, Stopped]
        phase:
          type: string
          description: Pending, Snapshotting, Streaming, Stopped, Failed or Deleting
        ready:
          type: boolean
        reason:
          type: string
        message:
          type: string
        slot:
          $ref: "#/components/schemas/SlotHealth"
        dropSlotSQL:
          type: string
          description: The SQL to drop the slot, while a deleted source cannot reach its database
        createdAt:
          type: string
          format: date-time
        deleting:
          type: boolean
    SourceList:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
    RetentionPreset:
      type: object
      required: [label, ms]
      properties:
        label:
          type: string
        ms:
          type: integer
          format: int64
    CleanupPolicyOption:
      type: object
      required: [name, tiered]
      properties:
        name:
          type: string
          enum: [delete, compact]
        tiered:
          type: boolean
          description: Whether topics of this policy offload history to tiered storage
    NewTopic:
      type: object
      required: [name, partitions, retentionMs, cleanupPolicy]
      properties:
        name:
          type: string
        partitions:
          type: integer
        retentionMs:
          type: integer
          format: int64
        cleanupPolicy:
          type: string
          enum: [delete, compact]
    ConsumerGroupList:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            type: string
    ConsumerGroupLagList:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ConsumerGroupLag"
    ConsumerGroupLag:
      type: object
      description: >-
        How far a consumer group is behind on one topic, as the agent measures
        it every 30 seconds without reading any message.
      required: [group, topic, lagSeconds, lagMessages, capped, history]
      properties:
        group:
          type: string
        topic:
          type: string
        lagSeconds:
          type: number
          description: >-
            The age of the oldest message the group has not consumed yet, the
            highest over the topic's partitions; 0 when it has consumed every
            message.
        lagMessages:
          type: integer
          format: int64
          description: The messages the group has not consumed yet, over the topic's partitions.
        capped:
          type: boolean
          description: >-
            True when the lag is older than the oldest time the agent looks up
            (23 hours), so lagSeconds is a lower bound.
        history:
          type: array
          description: The lag in seconds over the last hour, a point a minute.
          items:
            $ref: "#/components/schemas/Point"
    Throughput:
      type: object
      required: [range, stepSeconds, bytesIn, bytesOut]
      properties:
        range:
          type: string
        stepSeconds:
          type: integer
        bytesIn:
          type: array
          items:
            $ref: "#/components/schemas/Point"
        bytesOut:
          type: array
          items:
            $ref: "#/components/schemas/Point"
    Point:
      type: object
      required: [time, value]
      properties:
        time:
          type: string
          format: date-time
        value:
          type: number
    CustomerList:
      type: object
      required: [customers]
      properties:
        customers:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
    NewCustomer:
      type: object
      required: [displayName, profile, deletionProtection]
      properties:
        displayName:
          type: string
          description: The customer's name, which also names its Clerk organization
          minLength: 1
          maxLength: 100
        profile:
          type: string
          enum: [dev, dev-ha, production]
        deletionProtection:
          type: boolean
          description: Whether deprovisioning is refused until it is turned off
        inviteEmail:
          type: string
          description: Who to invite as the organization's first admin, if anyone
          maxLength: 254
    Customer:
      type: object
      required: [id, displayName, profile, ready, status, conditions, deletionProtection, createdAt]
      properties:
        id:
          type: string
        displayName:
          type: string
        profile:
          type: string
          enum: [dev, dev-ha, production]
        bootstrapAddress:
          type: string
          description: Where the customer's clients connect, once known
        ready:
          type: boolean
          description: Whether clients can connect
        status:
          $ref: "#/components/schemas/Status"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
        deletionProtection:
          type: boolean
        organizationID:
          type: string
          description: The Clerk organization whose members sign in as the customer, if any
        deleting:
          type: boolean
          description: Whether the customer is being deleted
        createdAt:
          type: string
          format: date-time
    Status:
      type: object
      description: The Ready condition, which says what the cluster waits for
      required: [reason, message]
      properties:
        reason:
          type: string
        message:
          type: string
    Condition:
      type: object
      required: [type, ready, reason, message]
      properties:
        type:
          type: string
          enum: [CertificateIssued, KafkaReady, UsersReady, AgentAvailable, Ready]
        ready:
          type: boolean
        reason:
          type: string
        message:
          type: string
        since:
          type: string
          format: date-time
